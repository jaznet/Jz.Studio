<!--techanTs.component.html-->

<div #divSvgContainer id="divSvgContainer" class="grid-rows" style="border-radius:8px">
  <svg #svgElement
       id="svgElement"
       [class.chart-viewport--pannable]="viewportPannable"
       [class.chart-viewport--dragging]="viewportDragging"
       (pointerdown)="onChartPointerDown($event)"
       (pointermove)="onChartPointerMove($event)"
       (pointerup)="onChartPointerUp($event)"
       (pointercancel)="onChartPointerCancel($event)"
       (pointerleave)="onChartPointerLeave()"
       (wheel)="onChartWheel($event)"
       (dblclick)="onChartDoubleClick($event)"
       (click)="onChartClick($event)">
    <rect #rSvgElement id="rSvgElement" class="rSvgElement" x="0" y="0" width="0" height="0" rx="8" ry="8" s></rect>
    <!-- X AXIS TOP -->
    <g #gAxisTop id="gAxisTop" class="x-axis-group">
      <rect #rAxisTop id="rAxisTop" class="axis-panel" width="0" height="0" x="0" y="0"></rect>
      <g #gAxisTopMonths id="gAxisTopMonths" class="x-axis"></g>
      <rect #rAxisTopMonths id="rAxisTopMonths" width="0" height="0" x="0" y="0" ></rect>
    </g>

    <g #gPanelHostsContainer id="gPanelHostsContainer">
      <rect #rPanelHostsContainer id="rPanelHostsContainer" class="panels-hosts-container" x="0" y="0" width="0" height="0"></rect>
    </g>

    <!-- X AXIS BOTTOM -->
    <g #gAxisBottom id="gAxisBottom" class="x-axis-group">
      <rect #rAxisBottom id="rAxisBottom" width="0" height="0"></rect>
      <g #gAxisBottomMonths id="gAxisBottomMonths" class="x-axis"></g>
    </g>

    @if (viewportPannable) {
      <g class="chart-viewport-range"
         aria-hidden="true"
         [attr.transform]="'translate('
           + (chartScaffold.width - chartScaffold.margins.right - 264)
           + ',' + (chartScaffold.xAxisTop + 8) + ')'">
        <rect width="166" height="18" rx="3" ry="3"></rect>
        <text x="83" y="9">{{ viewportRangeLabel }}</text>
      </g>

      <g class="chart-reset-control"
         role="button"
         tabindex="0"
         aria-label="Reset chart view"
         [attr.transform]="'translate('
           + (chartScaffold.width - chartScaffold.margins.right - 90)
           + ',' + (chartScaffold.xAxisTop + 8) + ')'"
         (pointerdown)="onResetViewPointerDown($event)"
         (click)="onResetViewControl($event)"
         (keydown.enter)="onResetViewControl($event)"
         (keydown.space)="onResetViewControl($event)">
        <rect width="82" height="18" rx="3" ry="3"></rect>
        <text x="41" y="9">RESET VIEW</text>
      </g>
    }

    @if (hiddenIndicatorControls.length > 0) {
      <g class="indicator-restore-controls"
         [attr.transform]="'translate('
           + indicatorRestoreControlsX
           + ',' + (chartScaffold.xAxisTop + 8) + ')'">
        @for (control of hiddenIndicatorControls; track control.chartType; let index = $index) {
          <g class="indicator-restore-control"
             role="button"
             tabindex="0"
             [attr.aria-label]="'Restore ' + control.label + ' panel'"
             [attr.transform]="'translate(' + (index * 82) + ', 0)'"
             (pointerdown)="stopIndicatorRestorePointer($event)"
             (click)="restoreIndicatorPanel($event, control.chartType)"
             (keydown.enter)="restoreIndicatorPanel($event, control.chartType)"
             (keydown.space)="restoreIndicatorPanel($event, control.chartType)">
            <rect width="74" height="18" rx="3" ry="3"></rect>
            <text x="37" y="9">+ {{ control.label }}</text>
          </g>
        }
      </g>
    }

    @if (anyIndicatorHidden) {
      <g class="indicator-reset-control"
         role="button"
         tabindex="0"
         aria-label="Restore all chart indicators"
         [attr.transform]="'translate('
           + restoreIndicatorsX
           + ',' + (chartScaffold.xAxisTop + 8) + ')'"
         (pointerdown)="stopIndicatorRestorePointer($event)"
         (click)="restoreAllIndicators($event)"
         (keydown.enter)="restoreAllIndicators($event)"
         (keydown.space)="restoreAllIndicators($event)">
        <rect width="118" height="18" rx="3" ry="3"></rect>
        <text x="59" y="9">RESTORE INDICATORS</text>
      </g>
    }

    @if (crosshairVisible) {
      <defs>
        <mask id="crosshair-panel-label-mask"
              maskUnits="userSpaceOnUse"
              x="0"
              y="0"
              [attr.width]="chartScaffold.width"
              [attr.height]="chartScaffold.height">
          <rect x="0"
                y="0"
                [attr.width]="chartScaffold.width"
                [attr.height]="chartScaffold.height"
                fill="white">
          </rect>
          @for (area of crosshairPanelLabelExclusions; track area.chartType) {
            <rect [attr.x]="area.x"
                  [attr.y]="area.y"
                  [attr.width]="area.width"
                  [attr.height]="area.height"
                  rx="5"
                  ry="5"
                  fill="black">
            </rect>
          }
        </mask>
      </defs>
      <g class="chart-crosshair"
         [class.chart-crosshair--pinned]="crosshairPinned"
         aria-hidden="true">
        <g mask="url(#crosshair-panel-label-mask)">
          <line class="crosshair-line crosshair-line--vertical"
                [attr.x1]="crosshairX"
                [attr.x2]="crosshairX"
                [attr.y1]="crosshairTop"
                [attr.y2]="crosshairBottom">
          </line>
          <line class="crosshair-line crosshair-line--horizontal"
                [attr.x1]="crosshairLeft"
                [attr.x2]="crosshairRight"
                [attr.y1]="crosshairY"
                [attr.y2]="crosshairY">
          </line>
        </g>
        <g class="crosshair-callout crosshair-callout--value">
          <rect [attr.x]="crosshairValueLabelX"
                [attr.y]="crosshairValueLabelY - 9"
                width="58"
                height="18"
                rx="3"
                ry="3">
          </rect>
          <text [attr.x]="crosshairValueLabelX + 29"
                [attr.y]="crosshairValueLabelY">
            {{ crosshairValueLabel }}
          </text>
        </g>
        <g class="crosshair-callout crosshair-callout--date">
          <rect [attr.x]="crosshairDateLabelX"
                [attr.y]="crosshairDateLabelY"
                width="82"
                height="18"
                rx="3"
                ry="3">
          </rect>
          <text [attr.x]="crosshairDateLabelX + 41"
                [attr.y]="crosshairDateLabelY + 9">
            {{ crosshairDateLabel }}
          </text>
        </g>
      </g>
    }

  </svg>
</div>
