
<div class="grid-rows">

  <div class="grid-row-fixed">

    <div class="toolbar">

      <jz-button variant="glass" icon="▣"
      (buttonClick)="openAdmin()">
       Data Mgr
      </jz-button>
    </div>

  </div>

  <jz-split-layout class="choro-panels"
                   direction="horizontal"
                   [primarySize]="50"
                   [minPrimarySize]="30"
                   [minSecondarySize]="30"
                   [secondaryVisible]="!!geographySelection">

    <jz-choro-dash-panel jzSplitPrimary
                         class="usa-panel">
      @if (geographyLoadError || !usaShapeSet) {
        <choro-geography-status
          [error]="geographyLoadError"
          (retryRequested)="retryGeography()">
        </choro-geography-status>
      } @else {
        <choro-usa
                   [shapeSet]="usaShapeSet"
                   [showCentroids]="showCentroids"
                   [centroidMode]="centroidDisplayMode"
                   [colorResolver]="colorResolver"
                   [selectedCountyId]="geographySelection?.countyId ?? null"
                   (countySelected)="onCountySelected($event)">
        </choro-usa>
      }
    </jz-choro-dash-panel>

    @if (geographySelection; as selection) {
      <div jzSplitSecondary
           class="state-column">

        <jz-choro-dash-panel class="state-panel">
          <choro-state
                       [stateId]="selection.stateId"
                       [shapeSet]="selection.stateShapeSet"
                       [colorResolver]="colorResolver"
                       [selectedCountyId]="selection.countyId"
                       (countySelected)="onCountySelected($event)">
          </choro-state>
        </jz-choro-dash-panel>

        <jz-choro-dash-panel class="state-table-panel">
          <choro-county-details
            [countyName]="selection.countyName"
            [stateName]="selection.stateName"
            [metricLabel]="metricLabel"
            [metricValue]="selectedCountyMetricValue">
          </choro-county-details>
        </jz-choro-dash-panel>

      </div>
    }

  </jz-split-layout>

</div>
