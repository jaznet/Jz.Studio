<jz-popover-panel [title]="title"
                  icon="⚠"
                  variant="error"
                  [showFooter]="true">

  <div class="jz-error-message">
    {{ message }}
  </div>

  <div jz-popover-footer>
    <button *ngIf="allowRetry"
            type="button"
            class="jz-popover-close-button"
            (click)="retry()">
      Retry
    </button>

    <button type="button"
            class="jz-popover-close-button"
            (click)="ok()">
      OK
    </button>
  </div>

</jz-popover-panel>
