<!-- base-chart.component.html-->

<svg>
<rect #rSvg width="0" height="0"></rect>
  <g #gSection id="gSection">
    <rect #rSection id="rSection" width="0" height="0"></rect>

    <g #gAxisGroupLeft id="gAxisGroupLeft">
      <rect #rAxisGroupLeft id="rAxisGroupLeft" width="0" height="0"></rect>
      <g #gAxisLeft id="gAxisLeft"></g>
    </g>

    <g #gContent id="gContent">
      <rect #rContent id="rContent" width="0" height="0"></rect>
      <g #gChart id="gChart"></g>
      <g class="panel-badge"
         [attr.transform]="'translate(' + panelBadgeX + ', 6)'">
        <rect [attr.x]="-panelBadgeWidth"
              y="0"
              [attr.width]="panelBadgeWidth"
              height="18"
              rx="4"
              ry="4">
        </rect>
        @if (!showMacdControls) {
          <text [attr.x]="-panelBadgeWidth + 7" y="12">
            @for (item of panelLegendItems; track item.label) {
              <tspan [attr.class]="item.className">{{ item.label }}</tspan>
            }
          </text>
        }
      </g>

      @if (showPanelToggle) {
        <g class="panel-toggle-control"
           role="button"
           tabindex="0"
           [attr.aria-label]="panelToggleLabel"
           [attr.transform]="'translate(8, 6)'"
           (pointerdown)="stopPanelTogglePointer($event)"
           (click)="togglePanel($event)"
           (keydown.enter)="togglePanel($event)"
           (keydown.space)="togglePanel($event)">
          <rect x="0"
                y="0"
                [attr.width]="panelBadgeWidth"
                height="18"
                rx="4"
                ry="4">
          </rect>
          @if (showMacdControls) {
            <text class="panel-collapse-glyph" x="10" y="12">−</text>
          }
        </g>
      }

      @if (showMacdControls) {
        <g class="macd-toggle-controls" transform="translate(35, 6)">
          @for (item of macdToggleItems; track item.series) {
            <g class="macd-toggle-control"
               [class.macd-toggle-control--hidden]="!isMacdVisible(item.series)"
               [class.macd-toggle-control--focused]="isMacdFocused(item.series)"
               [attr.transform]="'translate(' + item.x + ', 0)'"
               role="button"
               tabindex="0"
               [attr.aria-label]="'Toggle ' + item.label"
               [attr.aria-pressed]="isMacdVisible(item.series)"
               (pointerenter)="focusMacd(item.series)"
               (pointerleave)="clearMacdFocus(item.series)"
               (focus)="focusMacd(item.series)"
               (blur)="clearMacdFocus(item.series)"
               (pointerdown)="stopMacdTogglePointer($event)"
               (click)="toggleMacd($event, item.series)"
               (keydown.enter)="toggleMacd($event, item.series)"
               (keydown.space)="toggleMacd($event, item.series)">
              <rect x="0" y="0" [attr.width]="item.width" height="18" rx="3" ry="3"></rect>
              <text x="4" y="12" [attr.class]="item.className">{{ item.label }}</text>
            </g>
          }
        </g>
      }

      @if (showSmaControls) {
        <g class="sma-toggle-controls"
           [attr.transform]="'translate(' + smaToggleStartX + ', 6)'">
          @for (item of smaToggleItems; track item.period; let index = $index) {
            <g class="sma-toggle-control"
               [class.sma-toggle-control--hidden]="!isSmaVisible(item.period)"
               [class.sma-toggle-control--focused]="isSmaFocused(item.period)"
               [attr.transform]="'translate(' + (index * smaToggleWidth) + ', 0)'"
               role="button"
               tabindex="0"
               [attr.aria-label]="'Toggle SMA ' + item.period"
               [attr.aria-pressed]="isSmaVisible(item.period)"
               (pointerenter)="focusSma(item.period)"
               (pointerleave)="clearSmaFocus(item.period)"
               (focus)="focusSma(item.period)"
               (blur)="clearSmaFocus(item.period)"
               (pointerdown)="stopSmaTogglePointer($event, item.period)"
               (click)="toggleSma($event, item.period)"
               (keydown.enter)="toggleSma($event, item.period)"
               (keydown.space)="toggleSma($event, item.period)">
              <rect x="0" y="0" [attr.width]="smaToggleWidth" height="18" rx="3" ry="3"></rect>
              <text x="4" y="12" [attr.class]="item.className">{{ item.label }}</text>
            </g>
          }
        </g>
      }
    </g>

    <g #gAxisGroupRight id="gAxisGroupRight">
      <rect #rAxisGroupRight id="rAxisGroupRight" width="0" height="0"></rect>
      <g #gAxisRight id="gAxisRight"></g>
    </g>
  </g>
</svg>
