<!--techanTs.component.html-->

<div #divSvgContainer id="divSvgContainer" class="grid-rows" style="border-radius:8px">
  <svg #svgElement id="svgElement">
    <rect #rSvgElement id="rSvgElement" class="rSvgElement" x="0" y="0" width="0" height="0" rx="8" ry="8" s></rect>
    <!-- X AXIS TOP -->
    <g #gAxisTop id="gAxisTop" class="x-axis-group">
      <rect #rAxisTop id="rAxisTop" class="axis-panel" width="0" height="0" x="0" y="0"></rect>
      <g #gAxisTopMonths id="gAxisTopMonths" class="x-axis"></g>
      <rect #rAxisTopMonths id="rAxisTopMonths" width="0" height="0" x="0" y="0" ></rect>
    </g>

    <g #gPanelHostsContainer id="gPanelHostsContainer">
      <rect #rPanelHostsContainer id="rPanelHostsContainer" class="panels-hosts-container" x="0" y="0" width="0" height="0"></rect>
    </g>

    <!-- X AXIS BOTTOM -->
    <g #gAxisBottom id="gAxisBottom" class="x-axis-group">
      <rect #rAxisBottom id="rAxisBottom" width="0" height="0"></rect>
      <g #gAxisBottomMonths id="gAxisBottomMonths" class="x-axis"></g>
    </g>

  </svg>
</div>
