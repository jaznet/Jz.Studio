
<div class="grid-rows">

  <!--<dx-radio-group [items]="categories"
                  layout="horizontal"
                  (onValueChanged)="onValueChanged($event)">
  </dx-radio-group>-->

  <div class="grid-row-fixed">

    <div class="toolbar">

      <jz-button variant="glass" icon="▣"
      (buttonClick)="openAdmin()">
       Data Mgr
      </jz-button>
    </div>

  </div>

  <div class="choro-panels">

    <jz-choro-dash-panel class="usa-panel">
      <choro-usa #choro_usa
                 [shapeSet]="usaShapeSet"
                 [showCentroids]="showCentroids"
                 [centroidMode]="centroidDisplayMode"
                 (countySelected)="onCountySelected($event)">
      </choro-usa>
    </jz-choro-dash-panel>

    <div class="state-column">

      <jz-choro-dash-panel class="state-panel">
        <choro-state #choro_state
                     *ngIf="geographySelection as selection"
                     [stateId]="selection.stateId"
                     [shapeSet]="selection.stateShapeSet">
        </choro-state>
      </jz-choro-dash-panel>

      <jz-choro-dash-panel class="state-table-panel">
        table
      </jz-choro-dash-panel>

    </div>

  </div>

</div>
