<!--techanTs.component.html-->

<div #divSvgContainer id="divSvgContainer" class="grid-rows" style="margin:6px">
  <svg #svgElement id="svgElement">
    <rect #rSvgElement id="rSvgElement" class="rSvgElement" x="0" y="0" width="0" height="0" rx="10" ry="10"></rect>
    <g #gChartTitle id="gChartTitle">
      <rect #rChartTitle id="rChartTitle" class="rChartTitle"  width="0" height="0" fill="var(--plt-clr-2)"></rect>
      <text #tChartTitleText id="tChartTitleText"
            x="0" y="20"
            stroke="gray"
            fill="gray"
            text-anchor="middle" dominant-baseline="middle">Technical Analysis Chart</text>
    </g>

    <!-- X AXIS TOP -->
    <g #gAxisTop id="gAxisTop" class="x-axis-group">
      <rect #rAxisTop id="rAxisTop" class="axis-panel" width="0" height="0" x="0" y="0"></rect>
      <g #gAxisTopMonths id="gAxisTopMonths" class="x-axis"></g>
      <rect #rAxisTopMonths id="rAxisTopMonths" width="0" height="0" x="0" y="0" stroke="yellow"></rect>
    </g>

    <g #gPanelsContainer id="gPanelsContainer">
      <rect #rPanelsContainer id="rPanelsContainer" class="chart-placeholder" x="0" y="0" width="0" height="0"></rect>

      <g #panel1 id="gPanel1">
        <rect #rPanel1 id="rPanel1" class="chart-panel" width="0" height="0" x="0" y="0" />
        <text x="4" y="4" dominant-baseline="hanging" class="panel-text">Panel1</text>
      </g>
      <g #panel2 id="gPanel2">
        <rect width="0" height="0" x="0" y="0" class="chart-panel" />
        <text x="4" y="4" dominant-baseline="hanging">Panel2</text>
      </g>
      <g #panel3 id="gPanel3">
        <rect width="0" height="0" x="0" y="0" class="chart-panel" />
        <text x="4" y="4" dominant-baseline="hanging">Panel3</text>
      </g>
      <g #panel4 id="gPanel4">
        <rect width="0" height="0" x="0" y="0" class="chart-panel" />
        <text x="4" y="4" dominant-baseline="hanging">Panel4</text>
      </g>
    </g>

    <!-- X AXIS BOTTOM -->
    <g #gXaxisBottom id="gXaxisBottom" class="x-axis-group">
      <rect #xAxisBottomRect id="xAxisBottomRect" width="0" height="0"></rect>
      <g #xAxisMonthsBottom id="xAxisMonthsBottom" class="x-axis"></g>
    </g>

  </svg>
</div>

<pop-over-loading #popover_loading id="popover_loading"></pop-over-loading>
<pop-over-http-error #popover_httperror></pop-over-http-error>
