<!--techanTs.component.html-->

<div #divSvgContainer id="divSvgContainer" class="grid-rows" >
  <svg #svgElement id="svgElement">
    <rect #rSvgElement id="rSvgElement" class="rSvgElement" x="0" y="0" width="0" height="0"></rect>
    <g id="gChartTitle">
      <rect #rChartTitle
            id="rChartTitle"
            x="0"
            y="0"
            [attr.width]="scaffoldFramework?.width ?? 0"
            [attr.height]="scaffoldFramework?.titleHeight ?? 0"
            fill="var(--plt-clr-2)">
      </rect>

      <text id="tChartTitleText"
            [attr.x]="(scaffoldFramework?.width ?? 0) / 2"
            [attr.y]="(scaffoldFramework?.titleHeight ?? 0) / 2"
            text-anchor="middle"
            dominant-baseline="middle"
            fill="gray">
        {{ chartTitle }}
      </text>
    </g>

    <!-- X AXIS TOP -->
    <g #gAxisTop id="gAxisTop" class="x-axis-group">
      <rect #rAxisTop id="rAxisTop" class="axis-panel" width="0" height="0" x="0" y="0"></rect>
      <g #gAxisTopMonths id="gAxisTopMonths" class="x-axis"></g>
      <rect #rAxisTopMonths id="rAxisTopMonths" width="0" height="0" x="0" y="0" stroke="yellow"></rect>
    </g>

    <g #gPanelsContainer id="gPanelsContainer">
      <rect #rPanelsContainer id="rPanelsContainer" class="chart-placeholder" x="0" y="0" width="0" height="0"></rect>

      <!--<g #panel1 id="gPanel1">
        <rect #rPanel1 id="rPanel1" class="chart-panel" width="0" height="0" x="0" y="0" />
        <text x="4" y="4" dominant-baseline="hanging" class="panel-text">Panel1</text>
      </g>
      <g #panel2 id="gPanel2">
        <rect width="0" height="0" x="0" y="0" class="chart-panel" />
        <text x="4" y="4" dominant-baseline="hanging">Panel2</text>
      </g>
      <g #panel3 id="gPanel3">
        <rect width="0" height="0" x="0" y="0" class="chart-panel" />
        <text x="4" y="4" dominant-baseline="hanging">Panel3</text>
      </g>
      <g #panel4 id="gPanel4">
        <rect width="0" height="0" x="0" y="0" class="chart-panel" />
        <text x="4" y="4" dominant-baseline="hanging">Panel4</text>
      </g>-->
    </g>

    <!-- X AXIS BOTTOM -->
    <g #gAxisBottom id="gAxisBottom" class="x-axis-group">
      <rect #rAxisBottom id="rAxisBottom" width="0" height="0"></rect>
      <g #gAxisBottomMonths id="gAxisBottomMonths" class="x-axis"></g>
    </g>

  </svg>
</div>
