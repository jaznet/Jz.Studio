<!--jz-menu-tab.component.html-->

<div class="menu-tab"
     (click)="onTabClicked()"
     [ngStyle]="{  'border-radius':borderRadius,    }"
     [ngClass]="{
     'selected': isSelected,
     'horizontal': isHorizontal,
     'vertical': !isHorizontal,
     'sub-menu': isSubMenu,
     'main-menu': !isSubMenu
     }">

  <button-cuboid #tabbutton
                 class="jz-button"
                 [route]="route"
                 (clicked)="onTabClicked()">
    {{btnTxt}}
  </button-cuboid>
</div>
