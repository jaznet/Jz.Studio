<!--jz-button-3d.component.html-->

<button class="jz-btn jz-btn--3d"
        [attr.type]="type"
        [disabled]="disabled"
        [attr.aria-label]="ariaLabel || null" 
       >

  <span class="cuboid" aria-hidden="true"></span>

  <!-- Real accessible label (discernible text) -->
  <span class="label"><ng-content></ng-content></span>

</button>
