<!-- jz-button-cuboid.html -->
<!-- =======================================================================
     Jz Button Cuboid Template  |  Follows Jz-BEM convention
     Zones (clockwise from top-left):
       A (TL corner), 1 (Top edge), B (TR corner), 2 (Right edge),
       C (BR corner), 3 (Bottom edge), D (BL corner), 4 (Left edge), face (Center)
     ======================================================================= -->

<button class="jz-btn jz-btn--cuboid jz-btn--nine"
        [attr.type]="type"
        [disabled]="disabled"
        (click)="onClick()">
  <div class="cuboid">
    <!-- Top row -->
    <div class="zone A"></div>
    <div class="zone 1"></div>
    <div class="zone B"></div>

    <!-- Middle row -->
    <div class="zone 4"></div>
    <div class="zone face">
      <span class="jz-btn__content"
            [style.display]="hasText ? 'inline-flex' : 'none'">{{ text }}</span>
      <span class="jz-btn__content"
            [style.display]="hasText ? 'none' : 'inline-flex'">
        <ng-content></ng-content>
      </span>
    </div>
    <div class="zone 2"></div>

    <!-- Bottom row -->
    <div class="zone D"></div>
    <div class="zone 3"></div>
    <div class="zone C"></div>
  </div>
</button>
