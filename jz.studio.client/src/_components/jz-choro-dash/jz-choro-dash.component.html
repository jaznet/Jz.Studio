
<div class="grid-rows">

  <dx-radio-group [items]="categories"
                  layout="horizontal"
                  (onValueChanged)="onValueChanged($event)">
  </dx-radio-group>

  <div class="grid-row-fixed">USA Population</div>

  <div class="grid-rows">

    <div class="grid-col-fill choro-panels">

      <jz-choro-dash-panel class="grid-col-fill">
        <choro-usa #choro_usa></choro-usa>
      </jz-choro-dash-panel>

      <jz-choro-dash-panel class="state-panel">
        <choro-state #choro_state></choro-state>
      </jz-choro-dash-panel>

    </div>

    <div class="grid-col-fixed" style="width:150px">
      table
    </div>

  </div>

</div>
