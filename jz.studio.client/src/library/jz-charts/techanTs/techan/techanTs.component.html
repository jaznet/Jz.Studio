<!--techanTs.component.html-->

<div #divSvgContainer id="divSvgContainer" class="svg-container grid-rows">
  <svg #svgElement id="svgElement">
    <rect #rSvgElement id="rSvgElement" class="rSvgElement" x="0" y="0" width="0" height="0" rx="10" ry="10"></rect>
    <g #gChartTitle id="gChartTitle">
      <rect #rChartTitle id="rChartTitle"  width="0" height="0"></rect>
      <text #tChartTitleText id="tChartTitleText"
            x="0" y="20"
            stroke="gray"
            fill="gray"
            text-anchor="middle" dominant-baseline="middle">Technical Analysis Chart</text>
    </g>

    <!-- X AXIS TOP -->
    <g #gXaxisTop id="gXaxisTop" class="x-axis-group">
      <rect #xAxisTopRect id="xAxisTopRect" width="0" height="0" stroke="white"></rect>
      <g #xAxisMonthsTop id="xAxisMonthsTop" class="x-axis"></g>
    </g>

    <g #gPanelsContainer id="gPanelsContainer">
      <rect #rPanelsContainer id="rPanelsContainer" x="0" y="0" width="0" height="0" class="chart-section"></rect>

      <!-- #region OHLC SECTION-->
      <g #gOhlcSection id="gOhlcSection" class="ohlcSectionContainer">
        <rect #rOhlcSection
              id="rOhlcSection"
              width="0"
              height="0"
              class="chart-section"></rect>

        <text>OHLC</text>

        <!-- 👇 Template reference to chart and input bindings -->
        <ohlc-chart #ohlcChart
                    dateScaleX="dateScaleX">
                    <!--[data]="data.stockPriceHistoryData">-->
        </ohlc-chart>
      </g>

      <!-- #endregion OHLC CONTENT--> 
      <!-- #region SECTION MACD -->

      <!-- #endregion SECTION MACD -->
    </g>

    <!-- X AXIS BOTTOM -->
    <g #gXaxisBottom id="gXaxisBottom" class="x-axis-group">
      <rect #xAxisBottomRect id="xAxisBottomRect" width="0" height="0"></rect>
      <g #xAxisMonthsBottom id="xAxisMonthsBottom" class="x-axis"></g>
    </g>

  </svg>
</div>

<pop-over-loading #popover_loading id="popover_loading"></pop-over-loading>
<popover-http-error #popover_httperror></popover-http-error>
