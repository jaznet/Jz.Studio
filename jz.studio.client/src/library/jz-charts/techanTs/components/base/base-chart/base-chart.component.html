<!-- base-chart.component.html -->

<g #gChartContainer id="gChartContainer">
  <rect #rChartContainer width="0" height="0" x="0" y="0" id="rChartContainer" fill="gray"></rect>

  <g #gAxisGroupLeft id="gAxisGroupLeft">
    <rect #rAxisGroupLeft id="rAxisGroupLeft" width="0" height="0" x="0" y="0"></rect>
    <g #gAxisLeft id="gAxisLeft">
      <rect #rAxisLeft id="rAxisLeft"></rect>
    </g>
  </g>

  <g #gContent id="gContent">
    <rect #rContent id="rContent" width="0" height="0" x="0" y="0"></rect>
    <g #gChart id="gChart">
      <rect #rChart id="rChart"></rect>
    </g>
  </g>

  <g #gAxisGroupRight id="gAxisGroupRight">
    <rect #rAxisGroupRight id="rAxisGroupRight" width="0" height="0" x="0" y="0"></rect>
    <g #gAxisRight id="gAxisRight">
      <rect></rect>
    </g>
  </g>
</g>
