<g id="gChartContainer">
  <rect width="0" height="0" id="rChartContainer"></rect>

  <g id="gAxisGroupLeft">
    <rect id="rAxisRectLeft" width="0" height="0"></rect>
    <g id="gAxisLeft"></g>
  </g>

  <g id="gContent">
    <rect id="rContent" width="0" height="0"></rect>
    <g #gChart id="gChart"></g>

    <!-- 👇 Derived charts go here -->
    <ng-content></ng-content>
  </g>

  <g id="gAxisGroupRight">
    <rect id="rAxisRectRight" width="0" height="0"></rect>
    <g id="gAxisRight"></g>
  </g>
</g>
