<!--jz-button.component.html-->

<button class="jz3d jz-btn main-menu"
        [routerLink]="route"
        [queryParams]="queryParams"
        [attr.aria-pressed]="isSelected || null"
        style="--btn-w:150px; --btn-h:52px; --radius:22px; --fillet:7px; --depth:14px">
  <span class="label">{{ text }}</span>
</button>
