<!--jz-menu-tab.component.html-->

<div class="menu-tab"
     (click)="onTabClicked()"
     [ngStyle]="{  'border-radius':borderRadius,    }"
     [ngClass]="{
     'selected': isSelected,
     'horizontal': isHorizontal,
     'vertical': !isHorizontal,
     'sub-menu': isSubMenu,
     'main-menu': !isSubMenu
     }">

  <jz-button #tabbutton
       
             class="jz-button"
             [text]="btnTxt"
             [route]="route"
             [menuType]="menuType"
             [isSelected]="isSelected">
  </jz-button>
</div>
