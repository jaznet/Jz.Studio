<!-- main-menu.component.html -->

<div #menuContainer
     class="main-menu-container"
     style="margin-left:8px;margin-bottom:-2px;z-index:100"
     [ngStyle]="{ visibility: isMainMenuVisible }">

  <jz-nav-group class="main-menu menu-horizontal menu-view"
                [items]="navItems"
                [orientation]="'horizontal'"
                (selected)="onSubNavSelected($event)">
  </jz-nav-group>

</div>
