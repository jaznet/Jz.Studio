<div class="grid-row-fixed radio-button-container">

  <div class="palette-name" style="color:var(--plt-txt-1)">{{paletteName}}</div>

  @for (candidateName of paletteNames; track candidateName) {
    <jz-radio-button
      [palette]="candidateName"
      [btncolor]="shellTheme.getPalette(candidateName)?.clr3 ?? '#888'"
      [accentColor]="shellTheme.getPalette(candidateName)?.pop ?? '#666'"
      [borderColor]="shellTheme.getPalette(candidateName)?.clr1 ?? '#111'"
      [selectedColor]="shellTheme.getPalette(candidateName)?.highlight ?? '#fff'"
      [selected]="candidateName === paletteName"
      [previewLabel]="candidateName"
      [previewClr1]="shellTheme.getPalette(candidateName)?.clr1 ?? '#222'"
      [previewClr2]="shellTheme.getPalette(candidateName)?.clr2 ?? '#333'"
      [previewClr3]="shellTheme.getPalette(candidateName)?.clr3 ?? '#444'"
      [previewClr4]="shellTheme.getPalette(candidateName)?.clr4 ?? '#555'"
      [previewClr5]="shellTheme.getPalette(candidateName)?.clr5 ?? '#666'"
      [previewTxt1]="shellTheme.getPalette(candidateName)?.txt1 ?? '#fff'"
      [previewTxt2]="shellTheme.getPalette(candidateName)?.txt2 ?? '#ddd'"
      [attr.aria-label]="'Select ' + candidateName + ' palette'"
      (click)="setPalette(candidateName)">
    </jz-radio-button>
  }

</div>
