<!-- suites-menu.component.html -->

<div #suitesMenuContainer
     class="suites-menu-container"
     [ngStyle]="{ visibility: isSuiteMenuVisible }">

  <jz-nav-group *ngIf="items$ | async as items"
                class="main-nav"
                [class.blank-view]="(activeItem$ | async)?.layoutType === 'blank'"
                [items]="items"
                orientation="horizontal"
                (selected)="onNavSelected($event)">
  </jz-nav-group>

</div>
