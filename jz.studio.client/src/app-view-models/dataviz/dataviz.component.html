<!--dataviz.component.html-->

<div style="background-color:var(--plt-clr-1);height:100%;">
  <dataviz-menu style="background-color:var(--plt-clr-1);height:fit-content;margin-top:32px"></dataviz-menu>
</div>

<div #viewRouter id="viewRouter" class="grid-col-fill view-router-container ">
  <router-outlet></router-outlet>
</div>

<pop-over-loading #popover></pop-over-loading>
<pop-over-http-error #popover_httperror></pop-over-http-error>

<ng-template #popoverTemplate>
  <div style="max-width: 220px">
    <strong>Popover Title</strong><br>
    Content injected through TemplateRef.
  </div>
</ng-template>

<jz-pop-over [visible]="popoverVisible"
             [content]="popoverTemplate"
             [anchor]="anchor">
</jz-pop-over>
