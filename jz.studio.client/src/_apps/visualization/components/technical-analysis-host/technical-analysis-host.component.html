<div class="analysis-host">
  <form class="analysis-controls" (submit)="$event.preventDefault(); applySelection()">
    <label>
      Symbol
      <input #symbol
             type="text"
             maxlength="12"
             autocomplete="off"
             [value]="symbolInput"
             (input)="symbolInput = symbol.value.toUpperCase()">
    </label>

    <div class="range-presets" role="radiogroup" aria-label="Date range presets">
      @for (preset of rangePresets; track preset.months) {
        <label>
          <input type="radio"
                 name="dateRangePreset"
                 [checked]="selectedRangeMonths === preset.months"
                 (change)="selectRangePreset(preset.months)">
          {{ preset.label }}
        </label>
      }
    </div>

    <label>
      From
      <input #visibleStart
             type="date"
             [value]="visibleStartInput"
             (input)="onVisibleStartInput(visibleStart.value)">
    </label>

    <label>
      To
      <input #visibleEnd
             type="date"
             [value]="visibleEndInput"
             (input)="onVisibleEndInput(visibleEnd.value)">
    </label>

    <button type="submit" [disabled]="loading || !applyPending">Apply</button>

    @if (validationMessage) {
      <span class="validation-message">{{ validationMessage }}</span>
    }
  </form>

  <div class="analysis-chart">
    @if (!loading) {
      <jz-technical-analysis 
                             [dataWindow]="dataWindow"
                             [stockPriceHistoryData]="stockPriceHistoryData">
      </jz-technical-analysis>
    }
  </div>
</div>
