<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1000"
     height="240"
     viewBox="0 0 1000 240"
     role="img"
     aria-labelledby="title description">
  <title id="title">JZ Studio header wordmark</title>
  <desc id="description">An editable rounded-line JZ Studio wordmark.</desc>

  <!--
    Illustrator notes:
    - Every character is an independent path inside a named group.
    - No fonts, filters, masks, gradients, clipping paths, or raster images.
    - Expand strokes in Illustrator only when final outlines are required.
  -->

  <g id="JZ"
     class="jz-header-primary"
     fill="none"
     stroke="#eadbc7"
     stroke-linecap="round"
     stroke-linejoin="round">
    <path id="J" stroke-width="48" d="M 90 45 V 145 C 90 183 44 190 30 162"/>
    <path id="Z" stroke-width="42" d="M 163 48 H 292 L 170 182 H 292"/>
  </g>

  <path id="Divider"
