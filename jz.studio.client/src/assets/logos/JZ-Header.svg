    <path id="t" d="M 518 67 V 161 C 518 178 527 186 540 186 M 499 101 H 540"/>
    <path id="u" d="M 568 104 V 151 C 568 197 622 197 622 151 V 104"/>
    <path id="d" d="M 706 52 V 186 M 703 122 C 691 96 648 94 643 137 C 638 181 684 197 706 167"/>
    <path id="i" d="M 748 104 V 186 M 748 69 L 748 70"/>
    <path id="o" d="M 790 145 C 790 94 854 94 854 145 C 854 196 790 196 790 145 Z"/>
  </g>
</svg>
