<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="600" height="500">
  <style>
    text { font-family: 'Segoe UI', sans-serif; fill: #e0e0e0; font-size: 16px; }
    rect { rx: 10; ry: 10; stroke: #888; stroke-width: 1.2; }
    .layer { fill: #2d2d2d; }
    .arrow { stroke: #aaa; stroke-width: 2; marker-end: url(#arrowhead); }
    svg { background-color: #121212; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="4" refY="2" orient="auto" fill="#aaa">
      <path d="M0,0 L0,4 L4,2 Z" />
    </marker>
  </defs>

  <!-- Node.js -->
  <rect x="170" y="40" width="260" height="50" class="layer" />
  <text x="300" y="70" text-anchor="middle">Node.js + npm (Runtime & Package Manager)</text>

  <!-- TypeScript -->
  <rect x="190" y="120" width="220" height="50" class="layer" />
  <text x="300" y="150" text-anchor="middle">TypeScript (Language & Compiler)</text>

  <!-- Angular Build System -->
  <rect x="150" y="200" width="300" height="50" class="layer" />
  <text x="300" y="230" text-anchor="middle">Angular CLI / Vite (Build & Toolchain)</text>

  <!-- Angular Framework -->
  <rect x="180" y="280" width="240" height="50" class="layer" />
  <text x="300" y="310" text-anchor="middle">Angular Framework (App Logic & Templates)</text>

  <!-- Browser -->
  <rect x="200" y="360" width="200" height="50" class="layer" />
  <text x="300" y="390" text-anchor="middle">Browser (Execution & Rendering)</text>

  <!-- Arrows -->
  <line x1="300" y1="90" x2="300" y2="120" class="arrow" />
  <line x1="300" y1="170" x2="300" y2="200" class="arrow" />
  <line x1="300" y1="250" x2="300" y2="280" class="arrow" />
  <line x1="300" y1="330" x2="300" y2="360" class="arrow" />

  <!-- Caption -->
  <text x="300" y="450" text-anchor="middle" font-size="14" fill="#aaa">
    Root-System Model: Build & Execution Flow from Node → Browser
  </text>
</svg>
